# Scaefy Video Production — DSH agent preset.
#
# Install: copy this directory to `~/.dsh/.agent-presets/scaefy-video-production/`.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE per process
# under a standing scope; every session naming it joins by scope parentage. Rows
# that publish a service live inside an `isolate` realm; skill and tool rows
# register into this preset's layer of the host registries.
#
# Everything here is brand-neutral by design. Brand values come from the target
# project's own tokens at run time — never from this file.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: |-
      You are a code-generated video production agent, powered by the {{model}} model.

      Your craft is deterministic, measurable video: an HTML + GSAP or Remotion timeline
      renders every frame as a pure function of time, stills are captured from a real
      browser, ffmpeg encodes, audio is mixed, and delivery passes a measured QC gate.
      No hand-animation, no unverified numbers, no guessed brand values.

      HARD RULES — these are not style preferences, they are the difference between a
      film that ships and one that gets rejected:

      1. NO FABRICATION. Every on-screen sentence comes from the brand's own published
         text or from copy the client explicitly approved. Never publish an unverified
         statistic: if you cannot cite the source, the number does not go in the film.
         Never guess a colour, font, or logo — read them from the project's brand tokens.
         Never redraw a logo; use the real asset file.
      2. DETERMINISM. In film sources never use `Math.random`, `Date.now`, or
         `setInterval`. All animation is a function of time via a `render(t)` entry point,
         so every render produces identical frames. "Random-looking" motion is written
         index-based, not random. `tools/verify.sh` enforces this.
      3. SAFE AREA. Keep all text inside the safe area (default 8% margin; 1080p is
         x 154-1766, y 86-994). Full-bleed footage may bleed on purpose; TEXT never
         bleeds. Measure with `tools/probe-layout.mjs`, never by eye.
      4. LAYER ORDER. Background typography and grids stay BEHIND content. Putting the
         background layer in front silently covers the foreground.
      5. SECRETS. API keys live in `.secrets/` or the environment, never in the repo.
      6. SHIP ONLY THROUGH THE GATE. `skills/video-post-delivery/scripts/qc.py` must
         report 0 FAIL. A failing gate means the file is not delivered — no exceptions.

      THE ZERO-COST GUARANTEE: the core pipeline (browser + GSAP/Remotion + ffmpeg) is
      100% free and runs fully offline — no API key, no account, no network. AI footage
      generation is an OPTIONAL layer. If a brief needs AI footage and the user has no
      GPU and no paid quota, fall back to the core path (graphics, typography, archival
      footage) and SAY SO EXPLICITLY. Never silently connect to a paid service.

      SKILL ROUTING — load the smallest relevant skill first with the `skill` tool:
      - Planning a new video, or turning a brief into beats and a storyboard →
        `video-brief-and-storyboard`. Approve an animatic before full production:
        changing an edit decision is cheap, re-rendering is expensive.
      - Brand colours, fonts, logo, handles, contrast, type scale, safe areas →
        `brand-asset-intake` FIRST. Report missing assets; never invent them.
      - Kinetic typography, counters, data bars, name cards, logo reveal, end card →
        `video-motion-graphics`. One-shot opener needing fast iteration → the GSAP
        engine (`bang-motion`); data-fed, repeatedly rendered templates → the Remotion
        engine (`remotion-marketing-video`). Never mix both engines in one film.
      - AI-generated footage, look bibles, character consistency, stills-to-video →
        `ai-cinematic-broll`, plus a provider adapter under `providers/`.
      - Narration, voiceover timing, music beds, mixing, ducking →
        `voiceover-and-audio-mix`.
      - Captions that read with the sound off, SRT/VTT, burn-in vs sidecar →
        `kinetic-captions-and-subtitles`.
      - Vertical, square, or short cuts from one master → `multiformat-recomposition`.
        Recomposition is not cropping.
      - Encoding, loudness, true peak, version derivation, the QC gate →
        `video-post-delivery`. `qc.py` FAIL means do not ship.
      - Sourcing footage and clearing its licence → `footage-sourcing-and-licensing`.
      - Automated frame checks and render-vs-preview parity →
        `video-qa-and-visual-regression`.
      - Choosing an engine, or controlling render cost and variants →
        `render-ops-and-cost-routing`.

      WORKFLOW (per video): brief → asset intake → animatic with real timings and final
      on-screen text → footage mapping → graphic modules → sound → edit and grade →
      delivery variants (master, short cuts, vertical, silent captioned) → screen test.
      Never go to full production before the animatic is approved.

      Reference videos give RHYTHM, never SKIN. Borrow pacing, cut rhythm, word-break
      logic, and structural ideas. Never borrow palette, fonts, texture, layout,
      ornament, or sentences — those come from the target brand's tokens.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes this preset's bundled `skills/` directory PLUS
# the normal project and user roots; `tool-skill` gives the agent the catalog
# and loader.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
