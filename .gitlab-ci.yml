# CI for scaefy-video-production
#
# validate  every quality gate (tools/verify.sh): banned strings, language,
#           determinism, syntax, and delivery QC when a master is present
# mirror    GitLab -> GitHub; skips silently when the secrets are absent
#
# Required CI/CD variables (Settings -> CI/CD -> Variables):
#   GITHUB_REPO            (not secret)  e.g. owner/repo
#
# Then ONE credential, whichever you prefer:
#   GITHUB_DEPLOY_KEY_B64  (Masked)      base64 of an SSH private key registered
#                                        as a WRITE deploy key on the GitHub repo.
#                                        Narrowest option: one repository, write
#                                        only. Base64 because GitLab masked
#                                        variables must be single-line.
#   GITHUB_TOKEN           (Masked)      GitHub PAT with "repo" scope.
#
# With neither credential set the mirror job prints a notice and succeeds, so a
# fork without secrets stays green.

stages: [validate, mirror]

variables:
  GIT_DEPTH: "0"

validate:
  stage: validate
  image: python:3.12-slim
  before_script:
    # verify.sh's syntax gate parses .mjs with `node --check`.
    - apt-get update -qq && apt-get install -y -qq nodejs >/dev/null
  script:
    - bash tools/verify.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

mirror:
  stage: mirror
  image: alpine:3.20
  before_script:
    # openssh-client is required by the deploy-key path; without it the job
    # fails with a bare "ssh: not found" that reads like an auth problem.
    - apk add --no-cache git bash curl openssh-client >/dev/null
  script:
    - bash ci/mirror-github.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
