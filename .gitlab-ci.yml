# CI for scaefy-video-production
#
# validate  every quality gate (tools/verify.sh): banned strings, language,
#           determinism, syntax, and delivery QC when a master is present
# mirror    GitLab -> GitHub; skips silently when the secrets are absent
#
# Required CI/CD variables (Settings -> CI/CD -> Variables):
#   GITHUB_REPO   (not secret)  e.g. owner/repo
#   GITHUB_TOKEN  (Masked)      GitHub PAT with "repo" scope

stages: [validate, mirror]

variables:
  GIT_DEPTH: "0"

validate:
  stage: validate
  image: python:3.12-slim
  before_script:
    # verify.sh's syntax gate parses .mjs with `node --check`.
    - apt-get update -qq && apt-get install -y -qq nodejs >/dev/null
  script:
    - bash tools/verify.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

mirror:
  stage: mirror
  image: alpine:3.20
  before_script:
    - apk add --no-cache git bash curl >/dev/null
  script:
    - bash tools/mirror-github.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
